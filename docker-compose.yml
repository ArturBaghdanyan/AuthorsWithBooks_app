services:
  db:
    image: postgres:15-alpine
    container_name: books-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: books_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./books-backend
    container_name: books-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/books_db
      - PORT=5000
    depends_on:
      - db
    volumes:
      - ./books-backend:/app
      - /app/node_modules
    command: sh -c "npx sequelize-cli db:migrate && npm run dev"

volumes:
  postgres_data:
